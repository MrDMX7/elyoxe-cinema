# Cinema discounts by chain × card, maintained by hand (spec: docs/superpowers/specs/2026-09-25-cinema-design.md).
#
# confidence:
#   official      — read live on the cinema chain's or card programme's own page.
#   third-party   — a blog/aggregator, no official page found or the official page could not be read.
#   unconfirmed   — no source at all, or the only source is stale/expired/inferred.
#
# status: none_found marks a chain×card pair that WAS checked and has no offer, so the site can
# say "ما لقينا خصم" (we found no discount) instead of implying the chain refuses the card.
#
# type: percent (value = % off) | bogo (buy one get one free, price becomes price/2 — per person,
#       only with 2 tickets) | fixed (the offer sets the ticket price itself: value = AED incl. VAT;
#       the site shows min(real price, value)).
# excluded_halls / included_halls: a hall CODE from readers/common.py HALLS (what the reader emits
#   in show["hall"]) or a halls.yaml KEY (what build.py resolves from the chain's own label — e.g.
#   Novo «SKY», whose code is VIP, so excluding "VIP" would wrongly hit Novo's other VIP halls).
# included_cinemas: cinema ids (as the readers emit them) when an offer names its branches.
# Semantics: discounts.py compute(); src/cinema.js mirrors it; tests/test_parity.py holds them equal.
# Research date for every entry below: 2026-09-25 (seeded from
# research_notes/أفلام سينمات العين سبتمبر 2026/{discounts.md,tickets_prices.md}, then extended
# live for reel/roxy/cinemacity and the bank offers).

