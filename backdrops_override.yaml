# Manual override for steps/backdrops.py, when the automatic scorer picks (or would pick) a bad
# frame from a film's trailer, or there simply isn't a clean one in it.
#
#   <fid>: none        -- never show a trailer backdrop for this film; steps/backdrops.py never
#                          attempts it (or re-attempts it), and Kit.backdrop() always falls back to
#                          the poster-blur treatment.
#   <fid>: <seconds>   -- skip scoring entirely and take the frame at exactly this second into the
#                          trailer (still letterbox-cropped and encoded the normal way). Changing
#                          the number re-extracts on the next run; the cache is keyed on the value
#                          itself, not just the fid.
#
# fid must match a film's current fid (site_kit.FID/normalize.film_fid shape); an unknown/malformed
# key is ignored, never an error.

# sacrifice (trailer SEoOcTKx9S4): checked by hand -- this is a distributor-branded promotional cut,
# not a plain trailer. The "SACRIFICE | IN CINEMAS SEPTEMBER 24" bar is burned into the top of
# essentially every frame from roughly the 5s mark to the very end (only the opening production-logo
# card and the closing title card are without it, and neither is a usable backdrop either), so no
# timestamp in this trailer gives a clean frame -- confirmed by sampling ~20 timestamps across its
# full 104s by hand. This is why steps/backdrops.py's real run accepted a bad frame at t=78.3s
# (task-1-report.md, Fix round 1): the busy background made the scorer's edge-density checks blind
# to that permanent bar.
sacrifice: none
