# chains.yaml — per-chain constants the refresh applies to every show (normalize.finalize).
#
# ad_offset_min: minutes between the listed showtime and the film's first frame (adverts +
#   trailers). show.ends = start + ad_offset_min + the chain's own runtime (the UAE cut), shown
#   on the site as «يخلص تقريباً HH:MM» — always "approximately".
#   No chain publishes this figure (searched 2026-09-26: VOX's FAQ https://uae.voxcinemas.com/faq,
#   and Star's API field ads_time_in_mins is 0 on every session — a scheduling placeholder, not a
#   statement). So every chain carries the default 15 until one of them states its own number;
#   change a line here, with its source, when that happens.
default_ad_offset_min: 15
chains:
  vox:        {ad_offset_min: 15}
  star:       {ad_offset_min: 15}
  reel:       {ad_offset_min: 15}
  # note_ar/note_en: a chain-wide fact the pages say instead of «ما قدرنا نحدّث» (site_kit.fresh). Novo, read
  # 2026-11-18: uae.novocinemas.com and novocinemas.com forward to qa.novocinemas.com, its UAE sessions API is empty
  # since 2026-10-09, and ShowSouk shows 0 films at its 6 UAE branches too. Remove the note when Novo sells again.
  # withdrawn (owner 2026-11-19, after the deep check): while the chain has no show in the data, site_kit.Kit
  # takes its cinemas, rules and cards off every page; the reader keeps reading, and its first show brings it back.
  novo:       {ad_offset_min: 15, withdrawn: "2026-10", note_ar: "نوفو وقّفت البيع أونلاين في الإمارات من أكتوبر 2026، وموقعها يحوّل لقطر — المواعيد والحجز من الشباك أو بالاتصال بالسينما", note_en: "Novo has not sold tickets online in the UAE since October 2026 and its website now goes to Qatar — times and tickets at the box office or by phone"}
  roxy:       {ad_offset_min: 15}
  cineroyal:  {ad_offset_min: 15}
  cinemacity: {ad_offset_min: 15}
