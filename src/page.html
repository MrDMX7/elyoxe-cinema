<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots}}
<link rel="canonical" href="{{url}}">
<link rel="alternate" hreflang="ar" href="{{url_ar}}">
<link rel="alternate" hreflang="en" href="{{url_en}}">
<link rel="alternate" hreflang="x-default" href="{{url_ar}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{s_mark}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:locale" content="{{locale}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0F0B0C">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/icon.svg?v={{v}}" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
{{preload}}
<link rel="stylesheet" href="/assets/cinema.css?v={{v}}">
<script>document.documentElement.classList.add("js")</script>
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body data-page="{{page}}"{{attrs}}>
<a class="skip" href="#main">{{s_skip}}</a>
<header class="top"><div class="wrap top-in">
  <a class="mark" href="{{hub}}">{{s_mark}}</a>
  <nav class="nav" aria-label="{{s_nav}}">
    <a href="{{hub}}"{{c_films}}>{{s_films}}</a>
    <a href="{{cinemas_href}}"{{c_cinemas}}>{{s_cinemas}}</a>
    <a href="{{thursday_href}}"{{c_thursday}}>{{s_thursday}}</a>
    <a href="{{cards_href}}"{{c_cards}}>{{s_cards}}</a>{{nav_extra}}
  </nav>
  <a class="alt" href="{{alt}}" hreflang="{{alt_lang}}" lang="{{alt_lang}}">{{s_alt}}</a>
</div></header>
<main id="main">
{{body}}
</main>
<footer class="foot"><div class="wrap foot-in">
  <p>{{s_footer}}</p>
  <p class="foot-l"><a href="{{halls_href}}">{{s_halls}}</a> <a href="{{cards_href}}">{{s_cards}}</a> <a href="https://elyoxe.com/">{{s_studio}}</a></p>
</div></footer>
<script>window.CT = {{strings}};</script>
<script src="{{js}}" defer></script>
</body>
</html>
