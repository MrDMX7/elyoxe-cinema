<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots}}
<link rel="canonical" href="{{url}}">
<link rel="alternate" hreflang="ar" href="{{url_ar}}">
<link rel="alternate" hreflang="en" href="{{url_en}}">
<link rel="alternate" hreflang="x-default" href="{{url_ar}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{s_mark}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">

</head>
<body data-page="{{page}}"{{attrs}}>
<a class="skip" href="#main">{{s_skip}}</a>
<header class="top"><div class="wrap top-in">
  <a class="mark" href="{{hub}}"{{mark_attrs}}>{{mark}}</a>
  <nav class="nav" aria-label="{{s_nav}}">
    <a href="{{hub}}"{{c_films}}>{{s_films}}</a>
    <a href="{{cinemas_href}}"{{c_cinemas}}>{{s_cinemas}}</a>
    <a href="{{thursday_href}}"{{c_thursday}}>{{s_thursday}}</a>
    <a href="{{cards_href}}"{{c_cards}}>{{s_cards}}</a>
  </nav>
  <div class="tools">
    <button type="button" class="icon srch-b" data-search aria-haspopup="dialog" aria-label="{{s_search}}">{{icon_search}}</button>
    <a class="pill" id="pill-city" href="{{cinemas_page}}" data-sheet-open="sheet-city"><span data-city-name>{{city_name}}</span></a>
    <a class="pill" id="pill-card" href="{{cards_href}}" data-sheet-open="sheet-card"><span data-card-name>{{card_name}}</span></a>
    <a class="alt" href="{{alt}}" hreflang="{{alt_lang}}" lang="{{alt_lang}}">{{s_alt}}</a>
  </div>
</div></header>
<main id="main">
{{body}}
</main>
<footer class="foot"><div class="wrap foot-in">
  <a class="mark" href="{{hub}}"{{mark_attrs}}>{{mark}}</a>
  <nav class="foot-l" aria-label="{{s_more}}">
    {{foot_links}}
  </nav>
  <p class="foot-s">{{s_footer}} <a href="https://elyoxe.com/">{{s_studio}}</a></p>
</div></footer>
<nav class="tabs" aria-label="{{s_tabs}}">{{tabs}}</nav>
<div class="sh-scrim" data-sheet-scrim hidden></div>
{{sheets}}
<script>window.CT = {{strings}};</script>
<script id="boot">(function(u,d){function go(){var s=d.createElement("script"),late=d.readyState==="complete";s.src=u;if(late)s.onload=function(){var w=navigator.serviceWorker;if(w)w.register("/sw.js").catch(function(){})};d.body.appendChild(s)}if(d.prerendering)d.addEventListener("prerenderingchange",go,{once:true});else go()})("{{js}}",document)</script>
</body>
</html>
