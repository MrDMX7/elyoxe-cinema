# «عروض مجانية» — the free and community screenings no reader fetches (steps/free_screenings.py reads JLT, NYU Abu Dhabi,
# Cinema Akil's free sessions and Alserkal on every run). Each entry here was read on its source's own page, by hand,
# because the page blocks scripts (Louvre Abu Dhabi, Dubai Holding communities), is a yearly festival, or is on
# Instagram only. An entry disappears from the site by itself after its last day; delete it then or leave it.
#
# id        unique, stays the same (a slug)                    date / end_date  YYYY-MM-DD (end_date = a run of days)
# title     as the organiser writes it; title_ar if they give one   time  HH:MM (24h), "" when not stated
# venue / venue_ar, city (dubai, abu-dhabi, sharjah, al-ain, ajman, ras-al-khaimah, fujairah, umm-al-quwain)
# price     0 = free, a number = AED, null = not stated;  price_note_ar  a short line on what is free and what is not
# rsvp      true when the organiser asks you to book or register;  url  the organiser's own page
# kind      outdoor | museum | festival | university | arts | community;  note_ar  one line, light Emirati, optional
# checked   the day the entry was read on its page
items:
