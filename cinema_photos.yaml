# cinema_photos.yaml — one official photo URL per cinema (cinema_photos.py, steps/cinema_photo.py).
#
# {cid: <https:// URL of a real photo from that cinema's OWN chain site>} — never a stock photo, never
# another cinema's photo, never invented. A cid with no entry here simply shows no photo on its page
# (pages/_core/places.py's cinema_head checks for cinema["photo"] and renders the plain head when it is
# absent — nothing is guessed). cids match cinemas.yaml's keys.
#
# Filled 2026-09-30 (round3-gaps): every URL below was found on the chain's OWN site (the page is named above each),
# downloaded, checked to be an image of THAT cinema (lobby, foyer or hall — looked at, one by one), landscape and at
# least cinema_photos.MIN_WIDTH wide. 27 of 65 cinemas. The rest, and why (so nobody searches the same pages twice):
#   VOX (23)      its cinema pages carry no photo of the cinema at all — only generic hall banners with text on them,
#                 the same file under six names; no og:image, no schema.org image.
#   Reel (3)      one 225x265 portrait of the mall's outside per cinema, no larger size in its media library.
#   ROXY Circle Mall   its only image is an «NOW OPEN» promo banner with text.
#   Star (10)     Al Ghurair, Al Wahda, Bawadi, Century, Dana Plaza, Mall of Al Ain, RAK: only 250 px thumbnails (under
#                 MIN_WIDTH); Al Foah, Barari, Al Raha: the photo is the MALL's outside, not the cinema.
#   Cine Royal WTC Mall   3D renders, not photos.
# Cine Royal serves its photos as multipart/form-data and Star's big ones are 12–18 MB: cinema_photos.py trusts Pillow
# rather than the Content-Type and allows 20 MB for these. Novo's resizer URLs are used as the site's own page lists them.
