AWSTemplateFormatVersion: "2010-09-09"
Description: >
  «سينما» — static UAE cinema guide at https://cinema.elyoxe.com (ar at /, en at /en/).
  Its own private bucket + distribution, so no other site's `s3 sync --delete` can reach it
  and its own `--delete` can reach nothing else. Deployed by infra/setup_domain.py (stack
  elyoxe-cinema, ap-south-1); the ACM certificate lives in us-east-1 and comes in as a parameter.

Parameters:
  Domain:
    Type: String
    Default: cinema.elyoxe.com
  CertificateArn:
    Type: String
    Description: ISSUED ACM certificate for Domain, in us-east-1

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub elyoxe-cinema-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: elyoxe-cinema-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Copy of the shared `static-rewrite` function on E2QY4WECG1P5WO (the /tools* behavior):
  # www.<host> → https://<host>; "/dir/" and extension-less paths → "/dir/index.html"
  # (S3 through OAC has no directory index; DefaultRootObject covers only "/").
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: elyoxe-cinema-rewrite
      AutoPublish: true
      FunctionConfig: { Comment: www redirect + directory index, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var host = request.headers.host ? request.headers.host.value : '';
            if (host.indexOf('www.') === 0) {
                var qs = '';
                var keys = Object.keys(request.querystring);
                if (keys.length > 0) {
                    var parts = [];
                    for (var i = 0; i < keys.length; i++) {
                        parts.push(keys[i] + '=' + request.querystring[keys[i]].value);
                    }
                    qs = '?' + parts.join('&');
                }
                return {
                    statusCode: 301,
                    statusDescription: 'Moved Permanently',
                    headers: { location: { value: 'https://' + host.slice(4) + request.uri + qs } }
                };
            }
            var uri = request.uri;
            if (uri.endsWith('/')) {
                request.uri = uri + 'index.html';
            } else if (uri.split('/').pop().indexOf('.') === -1) {
                request.uri = uri + '/index.html';
            }
            return request;
        }

  # /geo (roadmap 237): the visitor's city among our eight, from CloudFront's viewer geolocation, answered by
  # the function itself (the bucket is never asked). FunctionCode is infra/geo.js verbatim (tests/test_geo.py
  # checks). First made by infra/geo.py, then imported into this stack (infra/geo_stack.py) — hence Retain.
  GeoFunction:
    Type: AWS::CloudFront::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: elyoxe-cinema-geo
      AutoPublish: true
      FunctionConfig: { Comment: "cinema /geo: city from the network", Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        // elyoxe-cinema-geo — viewer-request on the /geo behavior of the cinema distribution (E1200YJEC3LL6I).
        // Answers the request itself (it never reaches the bucket) with the visitor's city among our eight, read
        // from CloudFront's own geolocation of the viewer's address:
        //   {"city": "al-ain"}   or   {"city": null}   (outside the UAE, or a city/region we cannot place)
        // The CloudFront-Viewer-* headers reach a viewer-request function only because the behavior's origin
        // request policy (elyoxe-cinema-geo) lists them. The city name wins over the region: Al Ain sits in the
        // Abu Dhabi region. Nothing is logged; the answer is private, no-store (never cached, per visitor).
        var CITY = {
            'abu dhabi': 'abu-dhabi', 'abudhabi': 'abu-dhabi', 'musaffah': 'abu-dhabi', 'mussafah': 'abu-dhabi',
            'khalifa city': 'abu-dhabi', 'mohamed bin zayed city': 'abu-dhabi', 'ruwais': 'abu-dhabi', 'madinat zayed': 'abu-dhabi',
            'al ain': 'al-ain', 'alain': 'al-ain', 'ain': 'al-ain', 'al ain city': 'al-ain',
            'dubai': 'dubai', 'jebel ali': 'dubai', 'hatta': 'dubai',
            'sharjah': 'sharjah', 'ash shariqah': 'sharjah', 'khor fakkan': 'sharjah', 'khawr fakkan': 'sharjah',
            'kalba': 'sharjah', 'dibba al hisn': 'sharjah',
            'ajman': 'ajman', 'ajman city': 'ajman',
            'ras al khaimah': 'ras-al-khaimah', 'ras al khaymah': 'ras-al-khaimah', 'rak': 'ras-al-khaimah',
            'fujairah': 'fujairah', 'al fujairah': 'fujairah', 'al fujayrah': 'fujairah', 'dibba al fujairah': 'fujairah',
            'umm al quwain': 'umm-al-quwain', 'umm al qaiwain': 'umm-al-quwain', 'umm al qawain': 'umm-al-quwain'
        };
        // ISO 3166-2:AE subdivision codes (CloudFront-Viewer-Country-Region)
        var REGION = { AZ: 'abu-dhabi', DU: 'dubai', SH: 'sharjah', AJ: 'ajman', RK: 'ras-al-khaimah', FU: 'fujairah', UQ: 'umm-al-quwain' };
        // CloudFront-Viewer-Country-Region-Name, when the code is missing
        var REGION_NAME = { 'abu dhabi': 'abu-dhabi', 'dubai': 'dubai', 'sharjah': 'sharjah', 'ajman': 'ajman',
            'ras al khaimah': 'ras-al-khaimah', 'fujairah': 'fujairah', 'umm al quwain': 'umm-al-quwain' };

        function norm(s) {
            if (!s) return '';
            try { s = decodeURIComponent(s); } catch (e) {}
            s = s.toLowerCase().replace(/[‘’'`]/g, '').replace(/[^a-z]+/g, ' ').trim();
            if (s.indexOf('emirate of ') === 0) s = s.slice(11);
            return s;
        }

        function cityOf(country, city, region, regionName) {
            if ((country || '').toUpperCase() !== 'AE') return null;
            var c = norm(city);
            if (CITY[c]) return CITY[c];
            var r = (region || '').toUpperCase();
            if (REGION[r]) return REGION[r];
            var n = norm(regionName);
            return REGION_NAME[n] || null;
        }

        function h(headers, k) { return headers[k] ? headers[k].value : ''; }

        function handler(event) {
            var hs = event.request.headers;
            var city = cityOf(h(hs, 'cloudfront-viewer-country'), h(hs, 'cloudfront-viewer-city'),
                h(hs, 'cloudfront-viewer-country-region'), h(hs, 'cloudfront-viewer-country-region-name'));
            return {
                statusCode: 200,
                statusDescription: 'OK',
                headers: {
                    'content-type': { value: 'application/json; charset=utf-8' },
                    'cache-control': { value: 'private, no-store' },
                    'x-content-type-options': { value: 'nosniff' }
                },
                body: { encoding: 'text', data: JSON.stringify({ city: city }) }
            };
        }

  # A viewer-request function sees CloudFront-Viewer-* only when the behavior's origin request policy lists them.
  GeoPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OriginRequestPolicyConfig:
        Name: elyoxe-cinema-geo
        Comment: viewer geolocation for /geo (city from the network)
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [CloudFront-Viewer-City, CloudFront-Viewer-Country, CloudFront-Viewer-Country-Region, CloudFront-Viewer-Country-Region-Name]
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: none }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: cinema.elyoxe.com
        Aliases: [!Ref Domain]
        HttpVersion: http2and3
        IPV6Enabled: true
        # PriceClass_200 includes the Middle East edges (Dubai, Fujairah); PriceClass_100 does not.
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized (honours Cache-Control)
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /geo
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            Compress: false
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref GeoPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt GeoFunction.FunctionMetadata.FunctionARN
        # Missing key through OAC without s3:ListBucket is a 403 — both become the 404 page.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }

Outputs:
  Bucket: { Value: !Ref Bucket }
  DistributionId: { Value: !Ref Distribution }
  DistributionDomain: { Value: !GetAtt Distribution.DomainName }
