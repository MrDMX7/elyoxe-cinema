[pytest]
# infra/counter/layer/ (gitignored, built locally by deploy.sh — pip download of pywebpush's
# dependency wheels) ships its own tests/ directories (py_vapid's, in particular) that import
# things this project never installs (e.g. `mock`). pytest's default rootdir collection walks
# into it and fails collection repo-wide unless excluded. Same for the SAM scratch build dir.
norecursedirs = .git .aws-sam layer node_modules out
