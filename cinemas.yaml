# cinemas.yaml — the display name of every cinema, «chain — mall» in both languages (build.py).
#
# Readers give raw names ("Al Foah -Al Ain", "VOX Cinemas Kempinski- Mall of Emirates"); pages use
# these. Chain names follow halls.yaml (فوكس، ستار، ريل، سينما سيتي، سيني رويال، روكسي، نوفو); mall
# names are the Arabic the malls themselves use on their signs, sites and Google Maps labels. A cinema
# id missing here falls back to a cleaned reader name, and tests/test_build.py fails for any cinema in
# the real fixtures that has no entry — add it here when a chain opens one.
#
# lat, lng, coord_source: every cinema's location (phase 1: «أقرب سينما», «الوصول»), written by
# `python coords.py` — the chain's own API/site first, then the Google Maps link the chain
# publishes, then OpenStreetMap Nominatim; coord_source says which. normalize.finalize() copies
# them onto latest.json with maps = a Google Maps link to the coordinates.
# tests/test_data_additions.py fails for any real cinema without them.
