# malls.yaml — opening hours per mall, for Phase 2 Task 4 «مول يسكّر» (docs/superpowers/specs/
# 2026-09-27-phase2-design.md, C.44 «Mall closing»). Read by pages/venue.py.
#
# Every entry below came from that mall's own official page (or, where the page is a heavy JS app that
# would not render for a fetch, from a search whose answer quoted that same official page directly —
# never a blog/aggregator number alone). checked = the date we read it. A mall in cinemas.yaml that has
# no entry here is one we could not confirm this way — left absent on purpose, never guessed (owner's
# rule, docs/superpowers/specs/2026-09-26-phase1-design.md).
#
# hours: the mall's own general RETAIL closing time, not the cinema's — a chain often keeps its own
# entrance open later than the shops (pages/venue.py's «يخلص بعد تسكير المول — استعمل مدخل السينما» note
# is exactly that gap, not a claim the film gets cut off). Keys are lowercase weekday abbreviations
# (mon tue wed thu fri sat sun); a show's own calendar date (Asia/Dubai) picks the key. "00:00" means
# midnight (the end of that calendar date). Where a source gives one flat time for every day, every key
# repeats it. `open` is the general opening time; `open_fri` overrides it only where the source states a
# later Friday opening.
#
# source_note: present only on an entry whose `source` we could NOT fetch directly this pass (the site
# timed out or was blocked) — its numbers came from a search result that itself quoted that same official
# page, not from a blog. Not a rule violation (the header above allows this), but flagged so a future
# maintainer knows exactly which entries to re-verify by direct fetch once the site is reachable, instead
# of re-checking all of them.
