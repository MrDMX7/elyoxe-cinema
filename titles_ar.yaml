# titles_ar.yaml — the Arabic title of a film that no source gives in Arabic (W1-D2, MASTER-PLAN §5.2).
#
# enrich.py resolves every film's Arabic title in this order (never machine-translated):
#   pin (an entry here the owner reviewed, with `pin: true`) → Wikidata's Arabic label → its Arabic
#   aliases → the chain's own Arabic (Reel, Novo) → an entry here the owner reviewed.
# An Arabic-language film is always shown in Arabic, so for one of those an entry is used even before review.
#
# `review: true` means NOT reviewed yet: the entry is never published, and the film keeps its Latin title on
# `/` (owner default D12). To approve one, delete `review: true` (or set it to false). To correct a title a
# source gives, add `pin: true` and approve it. `python enrich.py titles` lists what is waiting, busiest first.
#
# One line per film id (the /film/<id>/ slug). `ar`: Arabic script, Western digits. `en`: the Latin title, to
# read the file by. `source`: where a non-proposed title comes from (a URL), else `proposed` (written here).
# Style of the proposals: the name as people say it at the box office (hard g as ق, v as ف, "the" as ذا),
# a translation only where one is already the film's known Arabic name (السنافر، بيت لحم).

titles:
